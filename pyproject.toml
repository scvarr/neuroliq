[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroliq"
version = "0.1.0"
description = "Исследовательский проект Neuroliq"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.28"]
web = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuroliq = ["static/*", "static/vendor/*"]
